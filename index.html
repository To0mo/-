<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate JS Obfuscator V6 - The "Obfuscator" Edition</title>
    <!-- LZ-String, Terser, and Babel Standalone (AST解析用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/terser/dist/bundle.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --bg: #09090b; --panel: #18181b; --primary: #06b6d4; --primary-hover: #0891b2; --success: #10b981; --text: #fafafa; --muted: #a1a1aa; --border: #27272a; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.2rem; color: var(--primary); text-align: center; margin-bottom: 5px; text-shadow: 0 0 15px rgba(6, 182, 212, 0.4); letter-spacing: -0.5px; }
        p.subtitle { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 25px; }
        
        .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }
        
        .editor-section { display: flex; flex-direction: column; gap: 15px; }
        .settings-section { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        
        h3 { margin-top: 0; color: #e4e4e7; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; }
        
        textarea { width: 100%; height: 260px; background: #000; color: #22d3ee; border: 1px solid var(--border); border-radius: 8px; padding: 15px; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; resize: vertical; box-sizing: border-box; transition: border-color 0.3s; line-height: 1.6; word-break: break-all; }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }
        
        .setting-item { display: flex; align-items: flex-start; margin-bottom: 16px; font-size: 0.9rem; }
        .setting-item input[type="checkbox"] { margin-top: 3px; margin-right: 12px; cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary); }
        .setting-text { flex: 1; }
        .setting-title { display: block; color: #e4e4e7; font-weight: 600; margin-bottom: 4px; }
        .setting-desc { font-size: 0.75rem; color: var(--muted); display: block; line-height: 1.4; }
        
        button { background: var(--primary); color: #000; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s; width: 100%; letter-spacing: 1px; }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4); color: #fff; }
        button:disabled { background: #3f3f46; cursor: not-allowed; transform: none; box-shadow: none; color: #a1a1aa; }
        
        .output-wrap { position: relative; margin-top: 10px; }
        #outputCode { color: #f472b6; height: 220px; background: #09090b; }
        .copy-btn { position: absolute; top: 12px; right: 12px; background: var(--success); color: white; padding: 6px 16px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; width: auto; font-weight: bold; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ultimate JS Obfuscator V6</h1>
        <p class="subtitle">Babel AST Integration / String Array Hexing / Random Multi-Chunks / The Obfuscator Style</p>
        
        <div class="layout">
            <div class="editor-section">
                <textarea id="inputCode" placeholder="ここにJavaScriptを入力してください...
例:
function superSecretLogic() {
  console.log('The Ultimate Obfuscation Activated!');
}
superSecretLogic();"></textarea>
                
                <button id="runBtn" onclick="runObfuscation()">🔥 究極難読化を実行 (Babel AST) 🔥</button>
                
                <div class="output-wrap">
                    <textarea id="outputCode" readonly placeholder="16進数と記号の海と化した最強のワンライナーがここに出力されます..."></textarea>
                    <button class="copy-btn" onclick="copyCode()">コピー</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>V6 AST エンジン設定</h3>
                
                <label class="setting-item">
                    <input type="checkbox" checked disabled>
                    <div class="setting-text">
                        <span class="setting-title">String Array & Hex Escape</span>
                        <span class="setting-desc">AST解析により全文字列を抽出し、16進数配列に変換して呼び出しを置換します。</span>
                    </div>
                </label>

                <label class="setting-item">
                    <input type="checkbox" checked disabled>
                    <div class="setting-text">
                        <span class="setting-title">Dynamic Multi-Chunking</span>
                        <span class="setting-desc">ペイロードを毎回5〜12個のランダムな数のチャンクに分散し、別々の暗号アルゴリズムを割り当てます。</span>
                    </div>
                </label>

                <label class="setting-item">
                    <input type="checkbox" checked disabled>
                    <div class="setting-text">
                        <span class="setting-title">AST $/_ 変数リネーム</span>
                        <span class="setting-desc">解析ツールを狂わせるため、変数名を $, _, 大小文字を混在させた4〜7文字のランダム文字に変更します。</span>
                    </div>
                </label>

                <label class="setting-item">
                    <input type="checkbox" checked disabled>
                    <div class="setting-text">
                        <span class="setting-title">Number to XOR AST</span>
                        <span class="setting-desc">コード上のすべての数字を「0xXX ^ 0xYY」のような複雑な16進数演算式に変換し、数字だらけの見た目を払拭します。</span>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <script>
        // --- ツール関数 ---
        function rc4Encode(key, str) {
            let s =[], j = 0, x, res = '';
            for (let i = 0; i < 256; i++) s[i] = i;
            for (let i = 0; i < 256; i++) {
                j = (j + s[i] + key.charCodeAt(i % key.length)) % 256;
                x = s[i]; s[i] = s[j]; s[j] = x;
            }
            let ii = 0, jj = 0;
            for (let y = 0; y < str.length; y++) {
                ii = (ii + 1) % 256; jj = (jj + s[ii]) % 256;
                x = s[ii]; s[ii] = s[jj]; s[jj] = x;
                res += String.fromCharCode(str.charCodeAt(y) ^ s[(s[ii] + s[jj]) % 256]);
            }
            return res;
        }

        function maskString(str, maskKey) {
            return Array.from(str).map(c => c.charCodeAt(0) ^ maskKey);
        }

        // バイナリ配列を The難読化 用の \x エスケープ文字列に変換する
        function bytesToHexEscapeString(bytes) {
            return bytes.map(b => '\\x' + b.toString(16).padStart(2, '0')).join('');
        }

        function strToHexEscapeString(str) {
            return Array.from(str).map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
        }

        // The難読化 の変数名生成器 ($, _, 大文字, 小文字のみで構成される4〜7文字)
        function genObfuscatedName() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            const symbols = '$_';
            const allChars = chars + symbols;
            const len = Math.floor(Math.random() * 4) + 4; // 4 to 7
            // 先頭は必ず文字か記号（数字はJSルールで不可のため入れない）
            let res = (Math.random() > 0.5 ? chars : symbols)[Math.floor(Math.random() * (Math.random() > 0.5 ? chars.length : symbols.length))];
            for(let i=1; i<len; i++) {
                res += allChars[Math.floor(Math.random() * allChars.length)];
            }
            return res;
        }

        // --- メイン処理 ---
        async function runObfuscation() {
            const input = document.getElementById('inputCode').value;
            const btn = document.getElementById('runBtn');
            const output = document.getElementById('outputCode');

            if (!input.trim()) return alert("コードを入力してください！");
            if (typeof Babel === 'undefined') return alert("Babel ASTコンパイラがまだロードされていません。数秒待ってから再試行してください。");

            btn.innerText = "⏳ AST 解析＆コンパイル中...";
            btn.disabled = true;

            try {
                // 1. Terser で初期Minify
                let tRes = await Terser.minify(input, { compress: true, mangle: true });
                if (tRes.error) throw tRes.error;
                let code = tRes.code;

                // 2. LZ-String 圧縮
                const compressed = LZString.compressToBase64(code);

                // 3. ランダムな数のチャンク（5〜12）に分割
                const numChunks = Math.floor(Math.random() * 8) + 5; 
                const cSize = Math.ceil(compressed.length / numChunks);
                const chunks =[];
                for(let i = 0; i < numChunks; i++) {
                    chunks.push(compressed.substring(i * cSize, (i + 1) * cSize) || " ");
                }

                // 4. 各チャンクにランダムな暗号化を適用し、CFFステートと復号ロジックを生成
                const chunkData = [];
                const states = [];
                const decodes =[];
                
                // 動的アルゴリズムの定義を別層化
                const fD_name = genObfuscatedName();
                const str_fn_XOR = "return function(p, k) { return p.map(x => String.fromCharCode(x ^ k)).join(''); }";
                const str_fn_SHIFT = "return function(p, o) { return p.map(x => String.fromCharCode(x - o)).join(''); }";
                const str_fn_RC4 = "return function(k, p) { let s=[], j=0, x, res=''; for(let i=0; i<256; i++) s[i]=i; for(let i=0; i<256; i++) { j=(j+s[i]+k.charCodeAt(i%k.length))%256; x=s[i]; s[i]=s[j]; s[j]=x; } let ii=0, jj=0; for(let y=0; y<p.length; y++) { ii=(ii+1)%256; jj=(jj+s[ii])%256; x=s[ii]; s[ii]=s[jj]; s[jj]=x; res+=String.fromCharCode(p[y]^s[(s[ii]+s[jj])%256]); } return res; }";

                for (let i = 0; i < numChunks; i++) {
                    let type = Math.floor(Math.random() * 3); // 0: XOR, 1: RC4, 2: Shift
                    let stateNum = Math.floor(Math.random() * 8000) + 1000;
                    states.push(stateNum);
                    
                    if (type === 0) {
                        let key = Math.floor(Math.random() * 250) + 1;
                        let enc = maskString(chunks[i], key);
                        chunkData.push({ idx: i, bytesHex: bytesToHexEscapeString(enc), type: 'x', arg: key });
                    } else if (type === 1) {
                        let key = "k" + Math.random().toString(36).substring(2, 6);
                        let encStr = rc4Encode(key, chunks[i]);
                        let encBytes = Array.from(encStr).map(c => c.charCodeAt(0));
                        chunkData.push({ idx: i, bytesHex: bytesToHexEscapeString(encBytes), type: 'r', arg: `"${key}"` });
                    } else {
                        let shift = Math.floor(Math.random() * 20) + 1;
                        let enc = chunks[i].split('').map(c => (c.charCodeAt(0) + shift) % 256);
                        chunkData.push({ idx: i, bytesHex: bytesToHexEscapeString(enc), type: 's', arg: shift });
                    }
                }

                // CFF ステートチェーンの組み立て
                for (let i = 0; i < numChunks; i++) {
                    let nextState = (i === numChunks - 1) ? 99999 : states[i + 1];
                    let ch = chunkData[i];
                    decodes.push(`[${states[i]}]: function() {
                            let dStr = "${ch.bytesHex}";
                            let arr =[];
                            for(let i=0; i<dStr.length; i++) arr.push(dStr.charCodeAt(i));
                            cR[${i}] = ${fD_name}['${ch.type}'](${ch.type==='r' ? ch.arg+', arr' : 'arr, '+ch.arg});
                            s ^= ${states[i] ^ nextState};
                        }
                    `);
                }

                const initState = states[0];
                const str_fn_LZ = `return function() { const f=String.fromCharCode,k="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=",b={};function g(c){if(!b[c]){b[c]={};for(let i=0;i<k.length;i++){b[c][k.charAt(i)]=i;}}return b[c];}return{decompressFromBase64:function(I){if(I==null)return"";if(I=="")return null;return this._decompress(I.length,32,function(X){return g(k)[I.charAt(X)];});},_decompress:function(L,R,G){let D=[],n,E=4,S=4,N=3,e="",r=[],i,w,B,rb,M,P,c,d={v:G(0),p:R,x:1};for(i=0;i<3;i+=1){D[i]=i;}B=0;M=Math.pow(2,2);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}switch(n=B){case 0:B=0;M=Math.pow(2,8);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}c=f(B);break;case 1:B=0;M=Math.pow(2,16);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}c=f(B);break;case 2:return"";}D[3]=c;w=c;r.push(c);while(true){if(d.x>L){return"";}B=0;M=Math.pow(2,N);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}switch(c=B){case 0:B=0;M=Math.pow(2,8);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}D[S++]=f(B);c=S-1;E--;break;case 1:B=0;M=Math.pow(2,16);P=1;while(P!=M){rb=d.v&d.p;d.p>>=1;if(d.p==0){d.p=R;d.v=G(d.x++);}B|=(rb>0?1:0)*P;P<<=1;}D[S++]=f(B);c=S-1;E--;break;case 2:return r.join('');}if(E==0){E=Math.pow(2,N);N++;}if(D[c]){e=D[c];}else{if(c===S){e=w+w.charAt(0);}else{return null;}}r.push(e);D[S++]=w+e.charAt(0);E--;w=e;if(E==0){E=Math.pow(2,N);N++;}}}} }`;

                // 5. CFFディスパッチャを持つデコーダー全体を構築
                let coreLogic = `
                    const ${fD_name} = {
                        'x': ${str_fn_XOR.replace('return ', '')},
                        's': ${str_fn_SHIFT.replace('return ', '')},
                        'r': ${str_fn_RC4.replace('return ', '')},
                        'l': (${str_fn_LZ.replace('return function', 'function')})()
                    };
                    let cR =[];
                    let s = ${initState};
                    const m = {
                        ${decodes.join(',\n')},
                        [99999]: function() {
                            const dec = ${fD_name}['l'].decompressFromBase64(cR.join(''));
                            try { []["filter"]["constructor"](dec)(); } catch(e) {}
                            s = 0;
                        }
                    };
                    while (s !== 0) { m[s] && m[s](); }
                `;

                // ==========================================
                // 6. Babel AST トランスフォーメーション
                // ==========================================
                const stringArray =[];
                const renameMap = new Map();
                
                const babelPlugin = function({ types: t }) {
                    return {
                        visitor: {
                            // 変数・関数のリネーム（$, _, 大小文字）
                            Program(path) {
                                path.traverse({
                                    Scope(scopePath) {
                                        for (let name in scopePath.scope.bindings) {
                                            if (!renameMap.has(name)) renameMap.set(name, genObfuscatedName());
                                            scopePath.scope.rename(name, renameMap.get(name));
                                        }
                                    }
                                });
                            },
                            // プロパティアクセスをブラケットに変換 ( obj.prop -> obj['prop'] )
                            MemberExpression(path) {
                                if (!path.node.computed && t.isIdentifier(path.node.property)) {
                                    path.node.computed = true;
                                    path.node.property = t.stringLiteral(path.node.property.name);
                                }
                            },
                            // 文字列をString Array参照に置換
                            StringLiteral(path) {
                                if (path.node.value === 'use strict') return;
                                if (path.parent.type === 'Property' && path.parent.key === path.node) return; // オブジェクトキーの破壊防止
                                
                                const val = path.node.value;
                                let idx = stringArray.indexOf(val);
                                if (idx === -1) { idx = stringArray.length; stringArray.push(val); }
                                
                                path.replaceWith(t.memberExpression(t.identifier('_STR'), t.numericLiteral(idx), true));
                            },
                            // 数値をXOR演算のASTに置換
                            NumericLiteral(path) {
                                if (path.parent.type === 'UnaryExpression') return;
                                const val = path.node.value;
                                if (Number.isInteger(val) && val >= 0 && val < 0x7FFFFFFF && !path.node._isObfuscated) {
                                    const mask = Math.floor(Math.random() * 0xFFFF);
                                    const hidden = val ^ mask;
                                    const expr = t.binaryExpression('^', t.numericLiteral(hidden), t.numericLiteral(mask));
                                    expr.left._isObfuscated = true;
                                    expr.right._isObfuscated = true;
                                    path.replaceWith(expr);
                                }
                            }
                        }
                    };
                };

                // Babelコンパイル実行
                const babelResult = Babel.transform(`(()=>{${coreLogic}})();`, {
                    plugins: [babelPlugin],
                    minified: true,
                    comments: false,
                    compact: true
                });

                // ==========================================
                // 7. Post-Processing (The難読化 Hex String 化)
                // ==========================================
                
                // 抽出した文字列配列をすべて \x エスケープの16進数文字列にして先頭に定義
                const strArrHexed = stringArray.map(s => `"${strToHexEscapeString(s)}"`).join(',');
                let finalCode = `const _STR=[${strArrHexed}];\n${babelResult.code}`;

                // ASTで生成された数値 (0, 1, 9999など) をすべて 0x 形式の16進数に置換
                finalCode = finalCode.replace(/\b(\d+)\b/g, (match) => {
                    return '0x' + Number(match).toString(16);
                });

                // 完成
                output.value = finalCode;

            } catch (e) {
                alert("エラーが発生しました:\n" + e.message);
                console.error(e);
            } finally {
                btn.innerText = "🔥 究極難読化を実行 (Babel AST) 🔥";
                btn.disabled = false;
            }
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('コピーしました！\n16進数の海とString Arrayで構成されたThe 難読化コードです。');
        }
    </script>
</body>
</html>
